name: DealerRater Scrape — Spiffy KALI

on:
  workflow_dispatch:
    inputs:
      brands:
        description: 'Space-separated OEM list (e.g. GMC Dodge Ram Subaru Cadillac)'
        required: false
        default: 'GMC Dodge Ram Subaru Cadillac'

env:
  BRANDS: ${{ github.event.inputs.brands || 'GMC Dodge Ram Subaru Cadillac' }}

jobs:
  scrape:
    name: Scrape — ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        rep: [garrison, justin, mike]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper — ${{ matrix.rep }}
        run: python main.py --rep ${{ matrix.rep }} --oem ${{ env.BRANDS }}

      - name: Upload final CSV (net-new brands only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-NEW-BRANDS-FINAL-${{ github.run_id }}
          path: output/final/${{ matrix.rep }}-*-master.csv
          retention-days: 30

      - name: Upload raw CSV (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-NEW-BRANDS-raw-${{ github.run_id }}
          path: output/raw/dealerrater_*_raw.csv
          retention-days: 7
