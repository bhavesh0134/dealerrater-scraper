name: DealerRater Scrape — Garrison States

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python main.py

      - name: Upload final CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GARRISON-STATES-FINAL
          path: output/final/garrison-states-master.csv
          retention-days: 30

      - name: Upload raw CSV (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-backup
          path: output/raw/dealerrater_raw.csv
          retention-days: 7
