name: DealerRater Scrape — Spiffy KALI

on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape — ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        rep: [garrison, justin, mike]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper — ${{ matrix.rep }}
        run: python main.py --rep ${{ matrix.rep }}

      - name: Upload final CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-states-FINAL-${{ github.run_id }}
          path: output/final/${{ matrix.rep }}-states-master.csv
          retention-days: 30

      - name: Upload raw CSV (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-raw-backup-${{ github.run_id }}
          path: output/raw/dealerrater_raw.csv
          retention-days: 7
