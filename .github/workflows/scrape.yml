name: DealerRater Scrape

on:
  workflow_dispatch:
    inputs:
      rep:
        description: 'Rep territory to scrape (garrison / justin / mike)'
        required: true
        default: 'garrison'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python main.py --rep ${{ github.event.inputs.rep }}

      - name: Upload final CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rep }}-states-FINAL
          path: output/final/garrison-states-master.csv
          retention-days: 30

      - name: Upload raw CSV (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rep }}-raw-backup
          path: output/raw/dealerrater_raw.csv
          retention-days: 7
