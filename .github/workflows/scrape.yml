name: DealerRater Scrape — Spiffy KALI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode: sitemap, full-sitemap, or listing'
        required: false
        default: 'full-sitemap'
      brands:
        description: 'Space-separated OEM list (sitemap mode only)'
        required: false
        default: ''

jobs:
  scrape:
    name: Scrape — ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        rep: [garrison, justin, mike]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper — ${{ matrix.rep }} (${{ github.event.inputs.mode || 'listing' }} mode)
        run: |
          MODE="${{ github.event.inputs.mode || 'full-sitemap' }}"
          if [ "$MODE" = "full-sitemap" ]; then
            python main.py --mode full-sitemap --rep ${{ matrix.rep }} --exclude-file known_urls.txt
          elif [ "$MODE" = "listing" ]; then
            python main.py --mode listing --rep ${{ matrix.rep }} --exclude-file known_urls.txt
          else
            BRANDS="${{ github.event.inputs.brands }}"
            if [ -z "$BRANDS" ]; then
              python main.py --mode sitemap --rep ${{ matrix.rep }}
            else
              python main.py --mode sitemap --rep ${{ matrix.rep }} --oem $BRANDS
            fi
          fi

      - name: Upload final CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-${{ github.event.inputs.mode || 'full-sitemap' }}-FINAL-${{ github.run_id }}
          path: output/final/${{ matrix.rep }}-*.csv
          retention-days: 30

      - name: Upload raw CSV (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rep }}-${{ github.event.inputs.mode || 'full-sitemap' }}-raw-${{ github.run_id }}
          path: output/raw/*.csv
          retention-days: 7
