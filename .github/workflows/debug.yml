name: Debug — Dump DealerRater HTML

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Probe dealer pages + sitemap size
        run: |
          python3 - <<'EOF' | tee probe_output.txt
          import requests, re
          from bs4 import BeautifulSoup

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }
          session = requests.Session()

          # 1. Try fetching a known Ford dealer page
          test_urls = [
              "https://www.dealerrater.com/dealer/Jack-Madden-Ford-Sales-Inc-dealer-reviews-75/",
              "https://www.dealerrater.com/dealer/Fletcher-Jones-Toyota-of-Carson-dealer-reviews-94/",
          ]
          for url in test_urls:
              r = session.get(url, headers=headers, timeout=20)
              soup = BeautifulSoup(r.text, "lxml")
              title = soup.title.string.strip() if soup.title else "none"
              print(f"\n=== {url} ===")
              print(f"Status: {r.status_code} | Final: {r.url}")
              print(f"Title: {title}")
              # Extract key fields
              print("Body text snippet:", soup.get_text(" ", strip=True)[:500])
              # Find classes with dealer info
              classes = set()
              for tag in soup.find_all(True):
                  for c in tag.get("class", []):
                      if any(kw in c.lower() for kw in ["dealer","address","phone","rating","star","review","city","state","employee","staff"]):
                          classes.add(f"{tag.name}.{c}")
              print("Relevant classes:")
              for c in sorted(classes)[:30]:
                  print(" ", c)

          # 2. Count total dealers in sitemap + sample Ford/Garrison state dealers
          print("\n\n=== SITEMAP ANALYSIS ===")
          r = session.get(
              "https://uploads-dealerrater.s3.amazonaws.com/sitemap/US/dealership-reviews-sitemap.xml",
              headers=headers, timeout=30
          )
          urls = re.findall(r'<loc>(https://www\.dealerrater\.com/dealer/[^<]+)</loc>', r.text)
          print(f"Total dealers in sitemap: {len(urls)}")

          # Filter for our target brands
          brands = ["Ford", "Toyota", "Chevrolet", "Chrysler", "Mercedes", "Jeep", "Ram", "Dodge", "GMC", "Honda", "Nissan", "KIA"]
          matched = [u for u in urls if any(b.lower() in u.lower() for b in brands)]
          print(f"Brand-matched dealers: {len(matched)}")

          # Show sample
          print("Sample matched URLs:")
          for u in matched[:20]:
              print(" ", u)
          EOF

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: probe-dealer-pages
          path: probe_output.txt
          retention-days: 3
