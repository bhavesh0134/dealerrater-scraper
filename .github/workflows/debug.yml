name: Debug — Dump DealerRater HTML

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Probe state-make sitemap + sample dealer page
        run: |
          python3 - <<'EOF' | tee probe_output.txt
          import requests
          from bs4 import BeautifulSoup

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }
          session = requests.Session()

          # 1. Fetch state-make sitemap — real listing URLs
          print("=== dealer-reviews-state-make-sitemap.xml ===")
          r = session.get(
              "https://uploads-dealerrater.s3.amazonaws.com/sitemap/US/dealer-reviews-state-make-sitemap.xml",
              headers=headers, timeout=30
          )
          print(f"Status: {r.status_code}")
          # Show first 50 URLs + filter for Ford/California
          soup = BeautifulSoup(r.text, "xml")
          locs = [l.text.strip() for l in soup.find_all("loc")]
          print(f"Total URLs: {len(locs)}")
          # Show first 20
          for u in locs[:20]:
              print(u)
          print("...")
          # Filter for our targets
          targets = [u for u in locs if any(b.lower() in u.lower() for b in
                     ["ford","toyota","chevrolet","chrysler","mercedes"]) and
                     any(s.lower() in u.lower() for s in
                     ["california","texas","alaska","arizona","colorado"])]
          print(f"\n--- Matching target URLs: {len(targets)} ---")
          for u in targets[:20]:
              print(u)

          # 2. Fetch dealership-reviews-sitemap to understand dealer URL format
          print("\n=== dealership-reviews-sitemap.xml (first 30 URLs) ===")
          r2 = session.get(
              "https://uploads-dealerrater.s3.amazonaws.com/sitemap/US/dealership-reviews-sitemap.xml",
              headers=headers, timeout=30, stream=True
          )
          print(f"Status: {r2.status_code}")
          # Read just first 8KB to avoid huge download
          chunk = next(r2.iter_content(8192)).decode("utf-8", errors="ignore")
          soup2 = BeautifulSoup(chunk, "xml")
          locs2 = [l.text.strip() for l in soup2.find_all("loc")]
          for u in locs2[:30]:
              print(u)

          # 3. Fetch one of the real listing URLs if found
          if targets:
              print(f"\n=== Fetching first target listing page: {targets[0]} ===")
              r3 = session.get(targets[0], headers=headers, timeout=30)
              print(f"Status: {r3.status_code} | Final URL: {r3.url}")
              soup3 = BeautifulSoup(r3.text, "lxml")
              print(f"Title: {soup3.title.string if soup3.title else 'none'}")
              # Find dealer cards
              classes = set()
              for tag in soup3.find_all(True):
                  for c in tag.get("class", []):
                      if any(kw in c.lower() for kw in ["dealer","listing","review","result","card"]):
                          classes.add(f"{tag.name}.{c}")
              print("Dealer-related classes found:")
              for c in sorted(classes)[:30]:
                  print(" ", c)
              print("\nFirst 3000 chars of HTML:")
              print(r3.text[:3000])
          EOF

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: probe-sitemap
          path: probe_output.txt
          retention-days: 3
