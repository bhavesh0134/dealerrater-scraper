name: Debug — Dump DealerRater HTML

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Dump listing + detail HTML
        run: python main.py --probe --oem Ford --state California 2>&1 | tee probe_output.txt

      - name: Upload HTML dump
        uses: actions/upload-artifact@v4
        with:
          name: probe-html
          path: probe_output.txt
          retention-days: 3
